<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0F0F0F">
<style>
  :root { --sat: env(safe-area-inset-top, 47px); }
</style>
<title>KB Program — Thomas & Renaud</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0F0F0F;--card:#1A1A1A;--card2:#222;--border:#2A2A2A;
  --txt:#F5F5F5;--txt2:#888;--txt3:#555;
  --orange:#E8500A;--blue:#1A56DB;--green:#22C55E;--gold:#F59E0B;
  --red:#EF4444;--purple:#8B5CF6;
  --radius:14px;--radius-sm:9px;
  font-size:15px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;}

/* ── SCROLL CONTAINER ── */
.app{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(16px + env(safe-area-inset-top,47px)) 16px calc(80px + env(safe-area-inset-bottom,0px));}

/* ── BOTTOM NAV ── */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(15,15,15,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:100;
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:10px 4px 8px;border:none;background:none;cursor:pointer;
  color:var(--txt3);font-size:10px;letter-spacing:.02em;font-family:inherit;
  border-top:2px solid transparent;transition:color .15s,border-color .15s;}
.nav-btn .ni{font-size:19px;line-height:1;}
.nav-btn.on-T{color:var(--orange);border-top-color:var(--orange);}
.nav-btn.on-R{color:var(--blue);border-top-color:var(--blue);}
.nav-btn.on-home{color:var(--purple);border-top-color:var(--purple);}
.nav-btn.on-prog{color:var(--green);border-top-color:var(--green);}

/* ── PANES ── */
.pane{display:none;}.pane.active{display:block;}

/* ── TYPOGRAPHY ── */
.title-xl{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1;}
.title-lg{font-size:21px;font-weight:700;letter-spacing:-.02em;}
.title-md{font-size:16px;font-weight:700;}
.label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2);}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
.card+.card{margin-top:12px;}
.card-head{padding:16px;border-bottom:1px solid var(--border);}
.card-body{padding:14px 16px;}

/* ── DASHBOARD ── */
.dash-hero{
  background:linear-gradient(135deg,#1a1a1a 0%,#1f1500 50%,#1a1a1a 100%);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-bottom:14px;position:relative;overflow:hidden;
}
.dash-hero::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,80,10,.15) 0%,transparent 70%);
}
.xp-bar-wrap{background:var(--border);border-radius:99px;height:8px;margin:10px 0 6px;overflow:hidden;}
.xp-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--gold));
  transition:width .6s cubic-bezier(.4,0,.2,1);}
.streak-badge{display:inline-flex;align-items:center;gap:5px;
  background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);
  border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--gold);}
.level-badge{display:inline-flex;align-items:center;gap:5px;
  background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);
  border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--purple);}

/* ── STATS GRID ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
.stat-val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px;}
.stat-lbl{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.1em;}

/* ── BADGES ── */
.badges-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.badge{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700;
  border:1px solid;cursor:default;}
.badge.locked{opacity:.3;filter:grayscale(1);}
.badge-gold{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:var(--gold);}
.badge-green{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--green);}
.badge-blue{background:rgba(26,86,219,.1);border-color:rgba(26,86,219,.3);color:var(--blue);}
.badge-orange{background:rgba(232,80,10,.1);border-color:rgba(232,80,10,.3);color:var(--orange);}
.badge-purple{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.3);color:var(--purple);}

/* ── SÉANCES ── */
.seance-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.seance-tab{padding:12px 6px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--card);text-align:center;cursor:pointer;transition:all .15s;}
.seance-tab .st-ico{font-size:22px;margin-bottom:4px;}
.seance-tab .st-lbl{font-size:11px;font-weight:700;color:var(--txt2);}
.seance-tab.sel-A{border-color:var(--orange);background:rgba(232,80,10,.08);}
.seance-tab.sel-A .st-lbl{color:var(--orange);}
.seance-tab.sel-B{border-color:var(--green);background:rgba(34,197,94,.08);}
.seance-tab.sel-B .st-lbl{color:var(--green);}
.seance-tab.sel-C{border-color:var(--blue);background:rgba(26,86,219,.08);}
.seance-tab.sel-C .st-lbl{color:var(--blue);}

/* ── EXERCISE CARD ── */
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;transition:border-color .15s;}
.ex-card.warm{border-left:3px solid var(--gold);}
.ex-card.main{border-left:3px solid var(--orange);}
.ex-card.main-B{border-left:3px solid var(--green);}
.ex-card.main-C{border-left:3px solid var(--blue);}
.ex-card.cool{border-left:3px solid var(--purple);}
.ex-head{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.ex-icon{width:42px;height:42px;border-radius:10px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ex-info{flex:1;min-width:0;}
.ex-name{font-size:14px;font-weight:700;line-height:1.3;}
.ex-meta{font-size:11.5px;color:var(--txt2);margin-top:2px;}
.ex-chevron{font-size:16px;color:var(--txt3);transition:transform .2s;flex-shrink:0;}
.ex-card.open .ex-chevron{transform:rotate(180deg);}
.ex-body{display:none;padding:0 16px 14px;}
.ex-card.open .ex-body{display:block;}

/* ── GIF CONTAINER ── */
.gif-wrap{border-radius:10px;overflow:hidden;background:var(--card2);margin-bottom:12px;
  position:relative;aspect-ratio:16/9;}
.gif-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.gif-wrap iframe{width:100%;height:100%;border:none;}
.gif-label{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);
  border-radius:4px;padding:2px 7px;font-size:10px;color:#fff;font-weight:700;}

/* ── CHIPS ── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:700;}
.chip-sets{background:rgba(245,158,11,.12);color:var(--gold);border:1px solid rgba(245,158,11,.2);}
.chip-rest{background:rgba(139,92,246,.12);color:var(--purple);border:1px solid rgba(139,92,246,.2);}
.chip-tempo{background:rgba(34,197,94,.08);color:var(--green);border:1px solid rgba(34,197,94,.15);}

/* ── ZONE / MUSCLES ── */
.muscles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.muscle-tag{font-size:11px;padding:3px 9px;border-radius:4px;background:var(--card2);
  border:1px solid var(--border);color:var(--txt2);}
.muscle-tag.primary{background:rgba(232,80,10,.1);border-color:rgba(232,80,10,.25);color:var(--orange);}
.muscle-tag.primary-B{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.25);color:var(--green);}
.muscle-tag.primary-C{background:rgba(26,86,219,.1);border-color:rgba(26,86,219,.25);color:var(--blue);}

/* ── NOTES EX ── */
.ex-note{font-size:13px;color:var(--txt2);line-height:1.65;margin-bottom:10px;}
.ex-note strong{color:var(--txt);}
.thomas-note{background:rgba(232,80,10,.06);border:1px solid rgba(232,80,10,.2);
  border-radius:8px;padding:10px 12px;font-size:12.5px;color:#ffb088;line-height:1.6;margin-bottom:10px;}

/* ── TIMER ── */
.timer-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-radius:8px;border:1.5px solid var(--purple);background:rgba(139,92,246,.1);
  color:var(--purple);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;}
.timer-btn:active{background:rgba(139,92,246,.2);}

.timer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);
  display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:20px;}
.timer-overlay.show{display:flex;}
.timer-ring{position:relative;width:200px;height:200px;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring circle{fill:none;stroke-width:8;transition:stroke-dashoffset .5s linear;}
.timer-ring .bg{stroke:var(--card2);}
.timer-ring .fg{stroke:var(--purple);stroke-linecap:round;}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:48px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.timer-label{font-size:14px;color:var(--txt2);text-align:center;}
.timer-close{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 28px;color:var(--txt);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.timer-durations{display:flex;gap:8px;}
.timer-dur-btn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--card);color:var(--txt2);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.timer-dur-btn.active{border-color:var(--purple);color:var(--purple);}

/* ── JOURNAL ── */
.profile-hero{border-radius:var(--radius);padding:18px;margin-bottom:14px;
  display:flex;align-items:center;gap:14px;}
.profile-hero-T{background:linear-gradient(135deg,rgba(232,80,10,.15),rgba(232,80,10,.05));
  border:1px solid rgba(232,80,10,.2);}
.profile-hero-R{background:linear-gradient(135deg,rgba(26,86,219,.15),rgba(26,86,219,.05));
  border:1px solid rgba(26,86,219,.2);}
.profile-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:24px;flex-shrink:0;}
.avatar-T{background:rgba(232,80,10,.2);}
.avatar-R{background:rgba(26,86,219,.2);}
.mini-xp-bar{height:4px;border-radius:99px;background:var(--border);margin-top:6px;overflow:hidden;}
.mini-xp-fill{height:100%;border-radius:99px;transition:width .4s ease;}
.fill-T{background:linear-gradient(90deg,var(--orange),var(--gold));}
.fill-R{background:linear-gradient(90deg,var(--blue),var(--purple));}

.new-btn{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;}
.new-T{background:var(--orange);color:#fff;}
.new-R{background:var(--blue);color:#fff;}

/* ── SEANCE FORM ── */
.form-seance-sel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.fss{padding:12px 6px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--card);text-align:center;cursor:pointer;transition:all .12s;font-family:inherit;}
.fss .fi{font-size:20px;margin-bottom:3px;}
.fss .fl{font-size:11px;font-weight:700;color:var(--txt2);}
.fss.fa{border-color:var(--orange);background:rgba(232,80,10,.08);}
.fss.fa .fl{color:var(--orange);}
.fss.fb{border-color:var(--green);background:rgba(34,197,94,.08);}
.fss.fb .fl{color:var(--green);}
.fss.fc{border-color:var(--blue);background:rgba(26,86,219,.08);}
.fss.fc .fl{color:var(--blue);}

.ex-entry-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:8px;}
.ex-entry-name{font-size:13.5px;font-weight:700;margin-bottom:3px;}
.ex-entry-presc{font-size:11.5px;color:var(--txt2);margin-bottom:10px;}
.sets-grid{display:grid;grid-template-columns:28px 1fr 1fr auto;gap:6px;align-items:center;}
.sets-hdr{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--txt3);text-align:center;}
.sets-hdr:first-child{text-align:left;}
.set-num{font-size:13px;font-weight:700;color:var(--txt3);text-align:center;}
.set-inp{width:100%;padding:9px 4px;border:1.5px solid var(--border);border-radius:7px;
  font-size:17px;text-align:center;font-family:inherit;background:var(--card2);color:var(--txt);
  -moz-appearance:textfield;}
.set-inp::-webkit-outer-spin-button,.set-inp::-webkit-inner-spin-button{-webkit-appearance:none;}
.set-inp:focus{border-color:var(--orange);outline:none;background:#1f1500;}
.set-inp-R:focus{border-color:var(--blue);background:#00081f;}
.set-inp-left{border-color:rgba(232,80,10,.4);background:rgba(232,80,10,.04);}
.set-inp-left:focus{border-color:var(--orange);}
.check-btn{width:32px;height:32px;border-radius:7px;border:1.5px solid var(--border);
  background:var(--card2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;transition:all .1s;flex-shrink:0;}
.check-btn.done{background:var(--green);border-color:var(--green);}
.left-arm-sep{grid-column:1/-1;margin:8px 0 4px;display:flex;align-items:center;gap:8px;}
.left-arm-line{flex:1;height:1px;background:rgba(232,80,10,.2);}
.left-arm-lbl{font-size:10px;font-weight:700;color:var(--orange);white-space:nowrap;}

.note-area{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;font-family:inherit;background:var(--card2);color:var(--txt);resize:none;margin-top:10px;}
.note-area:focus{border-color:var(--purple);outline:none;}
.save-btn{width:100%;padding:15px;border-radius:var(--radius-sm);border:none;
  font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;}
.save-T{background:var(--orange);color:#fff;}
.save-R{background:var(--blue);color:#fff;}
.back-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;
  border:1px solid var(--border);background:none;color:var(--txt2);font-size:13px;
  cursor:pointer;font-family:inherit;margin-bottom:14px;}

/* ── HISTORY ── */
.hist-entry{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .1s;}
.hist-entry:active{border-color:var(--txt3);}
.hist-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.hist-seance{font-size:13px;font-weight:700;}
.hist-seance-A{color:var(--orange);}
.hist-seance-B{color:var(--green);}
.hist-seance-C{color:var(--blue);}
.hist-date{font-size:12px;color:var(--txt2);}
.hist-bottom{font-size:12px;color:var(--txt3);display:flex;align-items:center;gap:8px;}
.hist-xp{color:var(--gold);font-weight:700;}
.del-btn{padding:4px 8px;border-radius:5px;border:none;background:rgba(239,68,68,.1);
  color:var(--red);font-size:16px;cursor:pointer;}

/* ── DRAFT BANNER ── */
.draft-banner{background:rgba(245,158,11,.08);border:1.5px solid rgba(245,158,11,.25);
  border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;}
.draft-info{font-size:12.5px;color:var(--gold);}
.draft-btns{display:flex;gap:6px;flex-shrink:0;}
.btn-resume{padding:7px 13px;border-radius:7px;background:var(--gold);color:#000;
  border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-discard{padding:7px 10px;border-radius:7px;background:none;color:var(--txt3);
  border:1px solid var(--border);font-size:13px;cursor:pointer;}

/* ── PR FLASH ── */
.pr-flash{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:linear-gradient(90deg,var(--gold),var(--orange));color:#000;
  padding:10px 20px;border-radius:20px;font-size:14px;font-weight:800;
  z-index:300;transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
.pr-flash.show{transform:translateX(-50%) translateY(0);}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--card2);border:1px solid var(--border);color:var(--txt);
  padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;
  z-index:300;white-space:nowrap;transition:opacity .2s,transform .2s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── PROGRESS CHART ── */
.prog-chart{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:14px;}
.prog-chart-title{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--txt2);}
.prog-row{display:flex;align-items:center;justify-content:space-between;
  padding:7px 0;border-bottom:1px solid var(--border);}
.prog-row:last-child{border-bottom:none;}
.prog-ex{font-size:12.5px;color:var(--txt2);flex:1;padding-right:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prog-best{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;}
.prog-arrow{font-size:12px;font-weight:700;margin-left:6px;}
.prog-arrow.up{color:var(--green);}
.prog-arrow.down{color:var(--red);}
.prog-arrow.same{color:var(--txt3);}

/* ── MAISON ── */
.maison-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;margin-bottom:12px;}
.maison-head{padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;}
.maison-ico{font-size:22px;}
.maison-title{font-size:15px;font-weight:700;}
.maison-sub{font-size:12px;color:var(--txt2);margin-top:1px;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);
  display:none;align-items:flex-end;z-index:200;}
.modal-overlay.show{display:flex;}
.modal-sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;
  max-height:88vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  -webkit-overflow-scrolling:touch;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);}
.modal-title{font-size:17px;font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--card2);
  border:none;color:var(--txt2);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.modal-body{padding:16px;}

/* ── SECTION HEADER ── */
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;margin-top:4px;}
.sec-head h2{font-size:18px;font-weight:800;}
.sec-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 20px;color:var(--txt3);}
.empty-ico{font-size:40px;margin-bottom:12px;opacity:.5;}
.empty-txt{font-size:14px;line-height:1.7;}

/* ── RESPONSIVE GIF SEARCH LINK ── */
.yt-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  padding:7px 13px;border-radius:7px;background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.25);color:#ff6b6b;font-size:12px;font-weight:700;
  text-decoration:none;}
.yt-link:active{background:rgba(239,68,68,.2);}

@keyframes pulse-xp{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bounce-in{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.bounce-in{animation:bounce-in .4s ease forwards;}

/* ── YOUTUBE DEMO CARD ── */
.yt-card{display:block;text-decoration:none;border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid var(--border);}
.yt-thumb{background:linear-gradient(135deg,#1a0a00,#0d1a2e);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 16px;gap:10px;position:relative;}
.yt-play{width:52px;height:52px;background:#FF0000;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#fff;padding-left:4px;flex-shrink:0;
  box-shadow:0 4px 20px rgba(255,0,0,.35);}
.yt-name{font-size:14px;font-weight:700;color:var(--txt);text-align:center;line-height:1.3;}
.yt-cta{background:#FF0000;color:#fff;font-size:12.5px;font-weight:700;
  padding:10px 16px;text-align:center;letter-spacing:.02em;}
.yt-card:active .yt-cta{background:#cc0000;}
</style>

function getStreak(who){try{return parseInt(localStorage.getItem('streak_'+who))||0;}catch{return 0;}}
function updateStreak(who){
  const last=localStorage.getItem('lastDay_'+who)||'';
  const todayStr=today();
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yStr=yesterday.toISOString().slice(0,10);
  let s=getStreak(who);
  const wasAlreadyToday = last===todayStr;
  if(last===yStr) s++;
  else if(!wasAlreadyToday) s=1;
  localStorage.setItem('streak_'+who,s);
  localStorage.setItem('lastDay_'+who,todayStr);
  if(!wasAlreadyToday) checkSeriesMilestone(who, s);
  return s;
}
function getLevel(xp){return LEVELS.find(l=>xp>=l.min&&xp<l.max)||LEVELS[LEVELS.length-1];}
function getBadges(who){try{return JSON.parse(localStorage.getItem('badges_'+who))||[];}catch{return[];}}
function awardBadge(who,id){
  const b=getBadges(who);
  if(!b.includes(id)){b.push(id);localStorage.setItem('badges_'+who,JSON.stringify(b));}
}
function checkBadges(who){
  const j=getJ(who);
  if(j.length>=1) awardBadge(who,'first');
  if(j.length>=5) awardBadge(who,'five');
  if(j.length>=10) awardBadge(who,who==='T'?'warrior':'marathon');
  // Check week
  const now=Date.now();
  const week=j.filter(e=>now-new Date(e.date).getTime()<7*86400000);
  if(week.length>=3) awardBadge(who,'week');
}

// Draft
function draftKey(who){return 'draft_'+who;}
function saveDraft(who){
  const st={seance:journalSeance[who],date:journalDate[who],fields:{}};
  // Catch ALL input fields in the journal form for this user
  const wrap=document.getElementById('journalWrap-'+who);
  if(wrap){
    wrap.querySelectorAll('input[type="number"], input[type="date"], textarea').forEach(el=>{
      if(el.id&&el.value!=='') st.fields[el.id]=el.value;
    });
    // Also save check button states
    wrap.querySelectorAll('.check-btn').forEach(el=>{
      if(el.id&&el.classList.contains('done')) st.fields[el.id]='done';
    });
  }
  const gn=document.getElementById('gnote_'+who);
  if(gn) st.note=gn.value;
  try{localStorage.setItem(draftKey(who),JSON.stringify(st));}catch{}
}
function loadDraft(who){try{const r=localStorage.getItem(draftKey(who));return r?JSON.parse(r):null;}catch{return null;}}
function clearDraft(who){try{localStorage.removeItem(draftKey(who));}catch{}}
function hasDraftData(who){
  const d=loadDraft(who);
  return d&&Object.keys(d.fields||{}).length>0;
}

function goTo(tab){
  // Save draft for any open journal BEFORE switching pane
  ['T','R'].forEach(who=>{
    if(journalMode[who]==='new') saveDraft(who);
  });

  currentTab=tab;
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>{b.className='nav-btn';});
  const pane=document.getElementById('pane-'+tab);
  if(pane) pane.classList.add('active');
  const btn=document.getElementById('nav-'+tab);
  if(btn){
    const cls = tab==='T'?'on-T':tab==='R'?'on-R':tab==='prog'?'on-prog':tab==='maison'?'on-home':'on-home';
    btn.classList.add(cls);
  }
  document.getElementById('mainContent').scrollTop=0;
  if(tab==='home') renderDash();
  if(tab==='prog') renderSeance(currentSeance);
  if(tab==='maison') renderMaison();
  // For journal tabs: only render if NOT in new-entry mode (preserve DOM)
  if(tab==='T'){
    if(journalMode['T']==='new'){
      // DOM already exists — just restore any missing values from draft
      const d=loadDraft('T');
      if(d) setTimeout(()=>restoreDraft('T',d),30);
    } else {
      renderJournal('T');
    }
  }
  if(tab==='R'){
    if(journalMode['R']==='new'){
      const d=loadDraft('R');
      if(d) setTimeout(()=>restoreDraft('R',d),30);
    } else {
      renderJournal('R');
    }
  }
}

        }).join('')}

  if(Object.keys(prs).length>0){

        </div>
      </div>`;
    });
    html+=`</div></div>`;
  }

  document.getElementById('dashContent').innerHTML=html;
  setDashUser(who); // apply active button styles

function selectSeance(s){
  currentSeance=s;
  ['A','B','C'].forEach(x=>{

    t.className='seance-tab'+(x===s?' sel-'+x:'');

  renderSeance(s);
}

function renderSeance(s){
  const data=SEANCES[s];
  const col=data.color;
  let html='';

  // Header
  html+=`<div style="margin-bottom:14px;">
    <div class="title-lg" style="color:${col}">${data.ico} ${data.label}</div>
    <div class="label" style="margin-top:4px;">${data.dur}</div>
  </div>`;

  // ÉCHAUFFEMENT
  html+=`<div class="label" style="margin-bottom:8px;color:var(--gold);">⚡ Échauffement — 7 min</div>`;
  data.warmup.forEach((w,i)=>{
    html+=exCard(w,i,'warm',s);
  });

  // EXERCICES PRINCIPAUX
  html+=`<div class="label" style="margin:16px 0 8px;color:${col};">💪 Exercices principaux</div>`;
  data.exercises.forEach((e,i)=>{
    html+=mainExCard(e,i,s,data);

  // CORE (séance B uniquement)
  if(s==='B'&&data.core){
    html+=`<div class="label" style="margin:16px 0 8px;color:var(--purple);">🔥 Core — Sangle abdominale complète</div>`;
    data.core.forEach((e,i)=>{
      html+=coreCard(e,i);

  }

  // RÉCUPÉRATION
  html+=`<div class="label" style="margin:16px 0 8px;color:var(--purple);">🧘 Récupération — Étirements statiques</div>`;
  data.cooldown.forEach((w,i)=>{
    html+=exCard(w,i,'cool',s);
  });

  document.getElementById('seanceContent').innerHTML=html;
}

function renderJournal(who){
  const wrap=document.getElementById('journalWrap-'+who);
  if(!wrap) return;
  const mode=journalMode[who];
  if(mode==='new'){renderNewEntry(who,wrap);return;}
  if(mode==='detail'){renderDetail(who,wrap);return;}
  renderList(who,wrap);
}

function renderList(who,wrap){
  const isT=who==='T';
  const col=isT?'var(--orange)':'var(--blue)';
  const name=isT?'Thomas':'Renaud';
  const journal=getJ(who);
  const xp=getXP(who);
  const lv=getLevel(xp);
  const streak=getStreak(who);
  const hasDraft=hasDraftData(who);

  let html=`
  <div class="profile-hero profile-hero-${who}">
    <div class="profile-avatar avatar-${who}">${isT?'🟠':'🔵'}</div>
    <div style="flex:1;">
      <div style="font-size:18px;font-weight:800;color:${col};">${name}</div>
      <div style="font-size:12px;color:var(--txt2);">${lv.ico} ${lv.name} · ${xp} XP</div>
      <div class="mini-xp-bar"><div class="mini-xp-fill fill-${who}" style="width:${xp%500/5}%"></div></div>
      ${streak>0?`<div style="font-size:11px;color:var(--gold);margin-top:4px;">${streak>=3?'🔥':'📅'} ${streak} jour${streak>1?'s':''} consécutif${streak>1?'s':''}</div>`:''}
    </div>
  </div>`;

  if(hasDraft){
    const d=loadDraft(who);
    html+=`<div class="draft-banner">
      <div class="draft-info">📝 <strong>Brouillon</strong> — ${(SEANCES[d.seance]||{}).label||d.seance}${d.date?' · '+formatDate(d.date):''}</div>
      <div class="draft-btns">
        <button class="btn-resume" onclick="startNew('${who}',true)">Reprendre</button>
        <button class="btn-discard" onclick="discardDraft('${who}')">✕</button>
      </div>
    </div>`;
  }

  html+=`<button class="new-btn new-${who}" onclick="startNew('${who}')">+ Nouvelle séance</button>`;

  // Progress chart
  const prs=getPRs(who);
  if(Object.keys(prs).length>0){
    html+=`<div class="prog-chart"><div class="prog-chart-title">📈 Tes records</div>`;
    Object.entries(prs).slice(0,5).forEach(([id,pr])=>{
      const ex=EXERCISES_LIST.find(e=>e.id===id)||{name:id};
      html+=`<div class="prog-row">
        <div class="prog-ex">${ex.name}</div>
        <div><span class="prog-best" style="color:${col}">${pr.kg} kg</span>
        <span class="prog-arrow up">↑</span></div>
      </div>`;
    });
    html+=`</div>`;
  }

  // History
  if(journal.length===0){
    html+=`<div class="empty"><div class="empty-ico">🎯</div>
      <div class="empty-txt">Aucune séance.<br>Lance ta première !</div></div>`;
  } else {
    html+=`<div class="label" style="margin-bottom:10px;">Historique</div>`;
    journal.forEach(e=>{
      const si=SEANCES[e.seance]||{};
      const sets=e.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.kg||s.reps).length,0);
      html+=`<div class="hist-entry" onclick="showHistDetail('${who}','${e.id}')">
        <div class="hist-top">
          <span class="hist-seance hist-seance-${e.seance}">${si.ico||''} ${si.label||e.seance}</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="hist-date">${formatDate(e.date)}</span>
            <button class="del-btn" onclick="event.stopPropagation();confirmDel('${who}','${e.id}')">×</button>
          </div>
        </div>
        <div class="hist-bottom">
          <span>${sets} série${sets>1?'s':''}</span>
          ${e.xpEarned?`<span class="hist-xp">+${e.xpEarned} XP</span>`:''}
          ${e.note?'<span>💬</span>':''}
        </div>
      </div>`;
    });
  }

  wrap.innerHTML=html;
}

function startNew(who,resumeDraft=false){
  journalMode[who]='new';
  const draft=resumeDraft?loadDraft(who):null;
  if(draft){
    journalSeance[who]=draft.seance||'A';
    journalDate[who]=draft.date||today();
  } else {
    journalDate[who]=today();
    journalSeance[who]='A';
    clearDraft(who);
  }
  renderJournal(who);
  if(draft&&resumeDraft) setTimeout(()=>restoreDraft(who,draft),50);
  attachAutosave(who);
  document.getElementById('mainContent').scrollTop=0;
}

function renderNewEntry(who,wrap){
  const isT=who==='T';
  const col=isT?'var(--orange)':'var(--blue)';
  const seance=journalSeance[who];
  const data=SEANCES[seance];
  const exList=[...data.exercises,...(data.core||[])];
  const hasLeft=isT;
  const leftIds=['a_pec','a_epaules','a_lat','a_tri','a_curl','c_rowing','c_curl','c_elev'];

  let html=`
  <button class="back-btn" onclick="cancelNew('${who}')">← Retour</button>
  <div style="margin-bottom:14px;">
    <div style="font-size:17px;font-weight:800;color:${col};">Nouvelle séance</div>
  </div>
  <div class="form-seance-sel">
    ${['A','B','C'].map(s=>`<div class="fss${seance===s?' f'+s.toLowerCase():''}" onclick="setSeanc('${who}','${s}')">
      <div class="fi">${SEANCES[s].ico}</div>
      <div class="fl">${SEANCES[s].label.split('—')[1]?.trim()||s}</div>
    </div>`).join('')}
  </div>
  <div class="card" style="margin-bottom:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;">
    <span style="font-size:13px;color:var(--txt2);">Date</span>
    <input type="date" id="ndate_${who}" value="${journalDate[who]}"
      onchange="journalDate['${who}']=this.value;saveDraft('${who}')"
      style="flex:1;background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:var(--txt);font-size:14px;font-family:inherit;">
  </div>`;

  exList.forEach(ex=>{
    const nSets=parseInt(ex.prescribed?.split('×')[0])||3;
    const showLeft=hasLeft&&leftIds.includes(ex.id);
    let rows='<div class="sets-grid">';
    rows+=`<div class="sets-hdr">S.</div><div class="sets-hdr" style="text-align:center;">Charge (kg)</div><div class="sets-hdr" style="text-align:center;">Reps</div><div class="sets-hdr" style="text-align:center;">✓</div>`;
    for(let i=0;i<nSets;i++){
      rows+=`<div class="set-num">${i+1}</div>
        <input class="set-inp${isT?'':' set-inp-R'}" id="ki_${ex.id}_${i}_${who}" type="number" step="0.5" min="0" placeholder="kg">
        <input class="set-inp${isT?'':' set-inp-R'}" id="ri_${ex.id}_${i}_${who}" type="number" min="0" placeholder="reps">
        <button class="check-btn" id="ck_${ex.id}_${i}_${who}" onclick="toggleCheck('${ex.id}',${i},'${who}')">—</button>`;
    }
    if(showLeft){
      rows+=`<div class="left-arm-sep" style="grid-column:1/-1;"><div class="left-arm-line"></div><div class="left-arm-lbl">⚕ BRAS GAUCHE</div><div class="left-arm-line"></div></div>`;
      for(let i=0;i<nSets;i++){
        rows+=`<div class="set-num" style="color:var(--orange);">${i+1}G</div>
          <input class="set-inp set-inp-left" id="ki_L_${ex.id}_${i}_${who}" type="number" step="0.5" min="0" placeholder="kg G">
          <input class="set-inp set-inp-left" id="ri_L_${ex.id}_${i}_${who}" type="number" min="0" placeholder="reps G">
          <div></div>`;
      }
    }
    rows+='</div>';
    html+=`<div class="ex-entry-card">
      <div class="ex-entry-name">${ex.ico||'💪'} ${ex.name}</div>
      <div class="ex-entry-presc">${ex.prescribed}</div>
      ${rows}
      <button class="timer-btn" style="margin-top:10px;" onclick="startTimer(${ex.rest||75})">⏱ Timer repos ${ex.rest||75}s</button>
    </div>`;
  });

  html+=`<textarea class="note-area" id="gnote_${who}" rows="2" placeholder="Notes de séance..."></textarea>`;
  html+=`<button class="save-btn save-${who}" onclick="saveEntry('${who}')">✓ Enregistrer la séance</button>`;

  wrap.innerHTML=html;
}

function setSeanc(who,s){
  saveDraft(who);
  journalSeance[who]=s;
  renderJournal(who);
  if(loadDraft(who)) setTimeout(()=>restoreDraft(who,loadDraft(who)),50);
  attachAutosave(who);
}

function toggleCheck(exId,i,who){
  const btn=document.getElementById('ck_'+exId+'_'+i+'_'+who);
  if(!btn) return;
  btn.classList.toggle('done');
  btn.textContent=btn.classList.contains('done')?'✓':'—';
  saveDraft(who);
}

function saveEntry(who){
  const seance=journalSeance[who];
  const data=SEANCES[seance];
  const exList=[...data.exercises,...(data.core||[])];
  const isT=who==='T';
  const leftIds=['a_pec','a_epaules','a_lat','a_tri','a_curl','c_rowing','c_curl','c_elev'];
  const prs=getPRs(who);
  let newPR=false;
  let xpGained=0;

  const exercises=exList.map(ex=>{
    const nSets=parseInt(ex.prescribed?.split('×')[0])||3;
    const sets=[];
    for(let i=0;i<nSets;i++){
      const kg=document.getElementById('ki_'+ex.id+'_'+i+'_'+who)?.value||'';
      const reps=document.getElementById('ri_'+ex.id+'_'+i+'_'+who)?.value||'';
      const done=document.getElementById('ck_'+ex.id+'_'+i+'_'+who)?.classList.contains('done')||false;
      sets.push({kg,reps,done});
      if(kg&&reps){
        xpGained+=10;
        const kgN=parseFloat(kg);
        if(!prs[ex.id]||kgN>prs[ex.id].kg){
          prs[ex.id]={kg:kgN,reps,date:journalDate[who]};
          newPR=true;xpGained+=50;
        }
      }
    }
    const setsLeft=[];
    if(isT&&leftIds.includes(ex.id)){
      for(let i=0;i<nSets;i++){
        const kg=document.getElementById('ki_L_'+ex.id+'_'+i+'_'+who)?.value||'';
        const reps=document.getElementById('ri_L_'+ex.id+'_'+i+'_'+who)?.value||'';
        setsLeft.push({kg,reps});
      }
    }
    return {id:ex.id,sets,setsLeft};
  });

  xpGained+=100; // séance complète
  savePRs(who,prs);
  const newXP=addXP(who,xpGained);
  const streak=updateStreak(who);
  if(streak>0&&streak%7===0) xpGained+=200;

  const note=document.getElementById('gnote_'+who)?.value||'';
  const entry={id:genId(),date:journalDate[who],seance,exercises,note,xpEarned:xpGained};
  addEntry(who,entry);
  checkBadges(who);
  clearDraft(who);

  journalMode[who]='list';
  if(newPR){
    awardBadge(who,'pr');
    showPRFlash();
  }
  renderJournal(who);
  toast(`+${xpGained} XP 🔥`);
}

function cancelNew(who){
  journalMode[who]='list';
  renderJournal(who);
}

function confirmDel(who,id){
  if(confirm('Supprimer cette séance ?')){
    delEntry(who,id);
    renderJournal(who);
    toast('Supprimé');
  }
}

function discardDraft(who){
  if(confirm('Supprimer le brouillon ?')){
    clearDraft(who);
    renderJournal(who);
    toast('Brouillon supprimé');
  }
}

function showHistDetail(who,id){
  const entry=getJ(who).find(e=>e.id===id);
  if(!entry) return;
  const isT=who==='T';
  const col=isT?'var(--orange)':'var(--blue)';
  const si=SEANCES[entry.seance]||{};
  let body='';
  entry.exercises.forEach(ex=>{
    const exInfo=EXERCISES_LIST.find(e=>e.id===ex.id)||{name:ex.id};
    const rows=ex.sets.map((s,i)=>{
      if(!s.kg&&!s.reps) return '';
      return `<div style="display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
        <span style="color:var(--txt3);font-weight:700;">${i+1}</span>
        <span style="font-weight:800;color:${col};">${s.kg?s.kg+' kg':'—'}</span>
        <span>${s.reps?s.reps+' reps':'—'}</span>
        <span style="color:var(--green);">${s.done?'✓':''}</span>
      </div>`;
    }).join('');
    const leftRows=(ex.setsLeft||[]).filter(s=>s.kg||s.reps).map((s,i)=>
      `<div style="display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:6px;padding:5px 0;font-size:12px;background:rgba(232,80,10,.04);border-bottom:1px solid rgba(232,80,10,.1);">
        <span style="color:var(--orange);font-weight:700;">${i+1}G</span>
        <span style="font-weight:800;color:var(--orange);">${s.kg?s.kg+' kg G':'—'}</span>
        <span>${s.reps?s.reps+' reps':'—'}</span>
        <span></span>
      </div>`).join('');
    if(rows||leftRows){
      body+=`<div style="margin-bottom:16px;">
        <div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--txt);">${exInfo.name}</div>
        ${rows}${leftRows}
      </div>`;
    }
  });
  if(entry.note) body+=`<div class="ex-note" style="background:var(--card2);padding:10px;border-radius:8px;">💬 ${entry.note}</div>`;
  showModal(`${si.ico||''} ${si.label||entry.seance} — ${formatDate(entry.date)}`, body);
}

function restoreDraft(who,draft){
  if(!draft?.fields) return;
  Object.entries(draft.fields).forEach(([id,val])=>{
    const el=document.getElementById(id);
    if(!el) return;
    if(val==='done'){
      // Restore check button state
      el.classList.add('done');
      el.textContent='✓';
    } else {
      el.value=val;
    }
  });
  const gn=document.getElementById('gnote_'+who);
  if(gn&&draft.note) gn.value=draft.note;
}

// TIMER
// ═══════════════════════════════════════════════════════════
function startTimer(dur){
  timerDur=dur||90;timerSec=timerDur;
  clearInterval(timerInt);
  const circ=553;
  document.getElementById('timerCircle').style.strokeDashoffset=0;
  document.querySelectorAll('.timer-dur-btn').forEach(b=>{
    b.classList.toggle('active',parseInt(b.textContent)===timerDur);
  });
  document.getElementById('timerOverlay').classList.add('show');
  updateTimerDisplay();
  timerInt=setInterval(()=>{
    timerSec--;
    if(timerSec<=0){
      clearInterval(timerInt);
      beep();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      document.getElementById('timerLabel').textContent='C\'est parti ! 💥';
      document.getElementById('timerNum').textContent='GO';
      document.getElementById('timerCircle').style.strokeDashoffset=circ;
      return;
    }
    updateTimerDisplay();
    const pct=timerSec/timerDur;
    document.getElementById('timerCircle').style.strokeDashoffset=(1-pct)*circ;
  },1000);
}

function updateTimerDisplay(){
  document.getElementById('timerNum').textContent=timerSec;
  document.getElementById('timerLabel').textContent=timerSec>0?'Repos...':'Prochaine série !';
}

function setTimerDur(d){
  timerDur=d;
  clearInterval(timerInt);
  startTimer(d);
}

function closeTimer(){
  clearInterval(timerInt);
  document.getElementById('timerOverlay').classList.remove('show');
}

function beep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=880;
    osc.type='sine';
    gain.gain.setValueAtTime(.5,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+.4);
  }catch{}
}

function formatDate(d){
  if(!d) return '';
  try{return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});}
  catch{return d;}
}

function showStreakProgress(who) {
  const streak = getStreak(who);
  const next = SERIE_MILESTONES.find(m => m.days > streak);
  const prev = [...SERIE_MILESTONES].reverse().find(m => m.days <= streak);
  
  let body = `<div style="text-align:center;margin-bottom:20px;">
    <div style="font-size:48px;margin-bottom:8px;">${streak>=3?'🔥':'📅'}</div>
    <div style="font-size:28px;font-weight:800;color:var(--gold);">${streak} jour${streak>1?'s':''}</div>
    <div style="font-size:13px;color:var(--txt2);margin-top:4px;">de série consécutive</div>
  </div>`;
  
  body += '<div style="margin-bottom:16px;"><div class="label" style="margin-bottom:10px;">Paliers débloqués</div>';
  SERIE_MILESTONES.filter(m=>m.days<=streak).forEach(m=>{
    body+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
      <span style="font-size:20px;">${m.emoji}</span>
      <div style="flex:1;"><div style="font-size:13px;font-weight:700;color:${m.color};">${m.title}</div>
      <div style="font-size:11px;color:var(--txt3);">${m.days} jours · +${m.xp} XP</div></div>
      <span style="color:var(--green);font-weight:700;">✓</span>
    </div>`;
  });
  body+='</div>';
  
  if(next){
    const pct=Math.round(streak/next.days*100);
    body+=`<div style="background:var(--card2);border-radius:10px;padding:14px;">
      <div style="font-size:12px;color:var(--txt2);margin-bottom:8px;">Prochain palier</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <span style="font-size:22px;">${next.emoji}</span>
        <div><div style="font-size:14px;font-weight:700;color:${next.color};">${next.title}</div>
        <div style="font-size:12px;color:var(--txt3);">${next.days} jours · +${next.xp} XP</div></div>
      </div>
      <div style="background:var(--border);border-radius:99px;height:6px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:99px;transition:width .5s ease;"></div>
      </div>
      <div style="font-size:11px;color:var(--txt3);margin-top:5px;text-align:right;">${next.days-streak} jour${next.days-streak>1?'s':''} restant${next.days-streak>1?'s':''}</div>
    </div>`;
  }
  
  showModal('Ma série 🔥', body);
}
